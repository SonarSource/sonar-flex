name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: github-ubuntu-latest-s
    outputs:
      build-number: ${{ steps.build.outputs.BUILD_NUMBER }}
    permissions:
      id-token: write
      contents: write
      pull-requests: read
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - &mise
        name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.12

      - name: Build with Maven
        id: build
        uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy-pull-request: true
          maven-args: -Pcoverage -Pcoverage-report -Dcommercial -T1C
          sonar-platform: none
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer

      - name: Upload Maven build as pipeline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output-${{ steps.build.outputs.BUILD_NUMBER }}
          path: |
            **/target
            coverage/java/jacoco.xml
          retention-days: 7
          overwrite: true

      # Publish the plugin version for the PVF.
      - name: Prepare PVF candidate version
        uses: SonarSource/core-languages-tooling-public/prepare-pvf@master
        with:
          build-version: ${{ env.PROJECT_VERSION }}

      - name: Upload plugin JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-flex-plugin
          path: sonar-flex-plugin/target/sonar-flex-plugin-*.jar
          if-no-files-found: error
          retention-days: 1

  analysis:
    name: NEXT analysis
    needs: build
    # Match build-maven's should_scan policy; other refs only build and deploy.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/long/')
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - *checkout
      - *mise
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output-${{ needs.build.outputs.build-number }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          skip-build: true
          maven-args: -Pcoverage-report -Dcommercial -T1C
          sonar-platform: next
          artifactory-reader-role: private-reader

  windows:
    name: Windows Build
    needs: [build]
    runs-on: github-windows-latest-m
    permissions:
      id-token: write
      contents: write
    steps:
      - *checkout
      - *mise
      - name: Build Maven (no deploy)
        uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          sonar-platform: none
          maven-args: '-T1C'

  plugin_qa:
    name: Plugin QA (${{ matrix.sq_version }})
    runs-on: github-ubuntu-latest-s
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-')
    permissions:
      id-token: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        sq_version:
          - LATEST_RELEASE
          - DEV
    steps:
      - *checkout
      - &mise_no_cache
        name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.12
          cache_save: false
      - &download_jar
        name: Download plugin JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-flex-plugin
          path: sonar-flex-plugin/target

      - &secrets
        name: Get secrets from Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;
            development/kv/data/repox url | ARTIFACTORY_URL;
            development/artifactory/token/SonarSource-sonar-flex-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - &config_maven
        name: Configure Maven
        uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          artifactory-reader-role: private-reader
          disable-caching: 'true'

      - name: Run Plugin QA
        env: &qa_env
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
          ARTIFACTORY_URL: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_URL }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          cd its/plugin
          mvn verify -Pit-plugin -Dsonar.runtimeVersion=${{ matrix.sq_version }} -Dmaven.test.redirectTestOutputToFile=false -B -e -V

  ruling:
    name: Ruling
    runs-on: github-ubuntu-latest-s
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-')
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - *mise_no_cache
      - *download_jar
      - *secrets
      - *config_maven
      - name: Run Ruling
        id: ruling
        continue-on-error: true
        env: *qa_env
        run: |
          cd its/ruling
          mvn verify -Pit-ruling -Dsonar.runtimeVersion=LATEST_RELEASE -Dmaven.test.redirectTestOutputToFile=false -B -e -V
      - name: Prepare ruling artifact
        if: ${{ always() && steps.ruling.outcome == 'failure' }}
        uses: SonarSource/core-languages-tooling-public/prepare-ruling-artifact@792fbfa7eb7fcf1b5890807b567213b3a744fb5d
      - name: Update ruling and notify
        if: ${{ always() && (steps.ruling.outcome == 'success' || steps.ruling.outcome == 'failure') }}
        uses: SonarSource/core-languages-tooling-public/ruling-update-and-notify@61120a5cf23942b1ed2d8cbf10cd5a84e30c7c11 # master
        with:
          ruling-failed: ${{ steps.ruling.outcome == 'failure' }}
      - name: Preserve ruling test failure
        if: ${{ always() && steps.ruling.outcome == 'failure' }}
        run: exit 1

  promote:
    name: Promote
    runs-on: github-ubuntu-latest-s
    needs: [build, analysis, ruling, plugin_qa]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.ruling.result == 'success'
      && needs.plugin_qa.result == 'success'
      && (needs.analysis.result == 'success' || needs.analysis.result == 'skipped')
      && (needs.build.result == 'success' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-')))
    permissions:
      id-token: write
      contents: write
    steps:
      - *checkout
      - *mise_no_cache
      - name: Promote Maven artifacts
        uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true

  releasability:
    runs-on: github-ubuntu-latest-s
    name: Releasability
    needs:
      - promote
    permissions:
      id-token: write
      statuses: write
      contents: read
    steps:
      - uses: SonarSource/gh-action_releasability/releasability-status@v3
        if: >-
          github.ref_name == github.event.repository.default_branch ||
          startsWith(github.ref_name, 'branch-') ||
          startsWith(github.ref_name, 'dogfood-')
        with:
          optional_checks: "Jira"
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

  notify-build-failure:
    needs: [build, analysis, windows, plugin_qa, ruling, promote]
    if: >-
      always()
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: github-ubuntu-latest-s
    permissions:
      actions: read
      id-token: write # required for vault-action-wrapper in the shared slack-notify action
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-*', github.event.repository.default_branch) }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}
